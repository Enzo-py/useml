[build-system]
requires = ["hatchling>=1.18"]
build-backend = "hatchling.build"

[project]
name = "useml"
version = "1.0.2"
description = "One root for every ML cache, one gate for every download, data processed once."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Enzo-py", email = "85191552+Enzo-py@users.noreply.github.com" }]
keywords = ["machine learning", "deep learning", "cache", "experiments", "datasets",
            "huggingface", "reproducibility"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "numpy>=1.22",
    "tqdm>=4.60",
    "pyyaml>=6",
    "tomli>=1.1; python_version < '3.11'",
]

[project.urls]
Homepage = "https://github.com/Enzo-py/useml"
"Bug Tracker" = "https://github.com/Enzo-py/useml/issues"

[project.optional-dependencies]
hf = ["huggingface_hub>=0.20"]
gdrive = ["gdown>=4.6"]
watch = ["psutil>=5.9"]
all = ["huggingface_hub>=0.20", "gdown>=4.6", "psutil>=5.9"]
test = ["pytest>=7"]

[project.scripts]
useml = "useml.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/useml"]

# Only what users need: never local notes.
[tool.hatch.build.targets.sdist]
include = ["src/useml", "tests", "README.md", "LICENSE", "pyproject.toml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
