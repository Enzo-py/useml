<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<title>useml monitor</title>
<style>
  :root {
    --bg: #f7f7f5; --panel: #ffffff; --text: #1f2328; --muted: #656d76; --line: #e3e3e0;
    --accent: #3b5bdb; --ok: #2b8a3e; --warn: #b7791f; --bad: #c92a2a; --run: #1c7ed6;
    --bar: #e9ecef; --code: #f1f3f5;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #141517; --panel: #1c1d21; --text: #e6e6e6; --muted: #9aa0a6; --line: #2c2e33;
      --accent: #748ffc; --ok: #51cf66; --warn: #fcc419; --bad: #ff6b6b; --run: #4dabf7;
      --bar: #2c2e33; --code: #25262b;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
         font: 14px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  header { position: sticky; top: 0; z-index: 2; display: flex; gap: 12px; align-items: center;
           padding: 12px 16px; background: var(--panel); border-bottom: 1px solid var(--line); }
  header h1 { font-size: 16px; margin: 0; flex: 1; }
  button { font: inherit; padding: 6px 12px; border-radius: 6px; border: 1px solid var(--line);
           background: var(--panel); color: var(--text); cursor: pointer; }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  button:disabled { opacity: .6; cursor: wait; }
  label { color: var(--muted); font-size: 13px; display: flex; gap: 6px; align-items: center; }
  main { max-width: 1100px; margin: 0 auto; padding: 16px; display: grid; gap: 16px; }
  .panel { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 14px 16px; }
  .machines { display: grid; gap: 12px; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); }
  .machine h2 { font-size: 15px; margin: 0 0 6px; display: flex; justify-content: space-between; gap: 8px; }
  .muted { color: var(--muted); }
  .small { font-size: 12px; }
  .bar { height: 6px; background: var(--bar); border-radius: 3px; overflow: hidden; margin: 3px 0 8px; }
  .bar > span { display: block; height: 100%; background: var(--accent); }
  table { width: 100%; border-collapse: collapse; }
  th, td { text-align: left; padding: 7px 6px; border-bottom: 1px solid var(--line); vertical-align: top; }
  th { color: var(--muted); font-weight: 500; font-size: 12px; }
  tr.row { cursor: pointer; }
  tr.row:hover td { background: var(--code); }
  .badge { display: inline-block; padding: 1px 8px; border-radius: 10px; font-size: 12px;
           border: 1px solid currentColor; white-space: nowrap; }
  .s-done { color: var(--ok); } .s-running { color: var(--run); } .s-failed, .s-died { color: var(--bad); }
  .s-stopped, .s-new { color: var(--muted); } .s-silent { color: var(--warn); }
  pre { background: var(--code); padding: 10px; border-radius: 6px; overflow: auto; max-height: 360px;
        font: 12px/1.4 ui-monospace, SFMono-Regular, Menlo, monospace; white-space: pre-wrap; word-break: break-word; }
  h3 { font-size: 14px; margin: 16px 0 6px; }
  .steps td:first-child { width: 20px; }
  .figures { display: grid; gap: 10px; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); }
  .figures img { width: 100%; border: 1px solid var(--line); border-radius: 6px; background: #fff; }
  svg.chart { width: 100%; height: 160px; background: var(--code); border-radius: 6px; }
  .empty { color: var(--muted); padding: 20px 0; text-align: center; }
  .command { display: flex; gap: 8px; align-items: center; margin: 6px 0; }
  .command code { flex: 1; background: var(--code); padding: 6px 8px; border-radius: 6px;
                  font: 12px ui-monospace, SFMono-Regular, Menlo, monospace; overflow-x: auto; white-space: nowrap; }
  .settings td:nth-child(2) { font: 12px ui-monospace, SFMono-Regular, Menlo, monospace; word-break: break-all; }
  .editor { display: grid; gap: 8px; grid-template-columns: 1fr 1fr auto; align-items: end; }
  .editor input, .editor select { font: inherit; padding: 6px 8px; border: 1px solid var(--line); border-radius: 6px;
                                   background: var(--panel); color: var(--text); width: 100%; }
  .kv { display: grid; grid-template-columns: max-content 1fr; gap: 2px 14px; }
  .warn { color: var(--warn); }
  @media (max-width: 640px) { .editor { grid-template-columns: 1fr; } }
  @media (max-width: 640px) { .hide-sm { display: none; } header { flex-wrap: wrap; } }
</style>
</head>
<body>
<header>
  <h1>useml monitor</h1>
  <label><input type="checkbox" id="auto"> auto (15 s)</label>
  <button class="primary" id="refresh">Refresh</button>
</header>
<main>
  <div id="status" class="muted small"></div>
  <section class="machines" id="machines"></section>
  <section class="panel">
    <table>
      <thead><tr><th>Experience</th><th>Status</th><th class="hide-sm">Step</th><th>Progress</th><th class="hide-sm">Machine</th><th class="hide-sm">Updated</th></tr></thead>
      <tbody id="experiences"></tbody>
    </table>
    <div id="none" class="empty" hidden>No experience reported yet. Start an agent: <code>useml monitor start</code></div>
  </section>
  <section class="panel" id="detail" hidden></section>
</main>
<script>
"use strict";
let state = null, selected = null, busy = false, timer = null;
const $ = (id) => document.getElementById(id);

function el(tag, attrs = {}, ...children) {
  const node = document.createElement(tag);
  for (const [key, value] of Object.entries(attrs)) {
    if (key === "class") node.className = value;
    else if (key === "onclick") node.addEventListener("click", value);
    else node.setAttribute(key, value);
  }
  for (const child of children.flat()) {
    if (child === null || child === undefined) continue;
    node.append(child instanceof Node ? child : document.createTextNode(String(child)));
  }
  return node;
}
function ago(seconds) {
  if (seconds === null || seconds === undefined) return "—";
  if (seconds < 90) return `${Math.round(seconds)} s ago`;
  if (seconds < 5400) return `${Math.round(seconds / 60)} min ago`;
  if (seconds < 172800) return `${(seconds / 3600).toFixed(1)} h ago`;
  return `${Math.round(seconds / 86400)} d ago`;
}
function duration(seconds) {
  if (!seconds && seconds !== 0) return "";
  if (seconds < 90) return `${Math.round(seconds)} s`;
  if (seconds < 5400) return `${Math.round(seconds / 60)} min`;
  return `${(seconds / 3600).toFixed(1)} h`;
}
function bytes(value) {
  if (!value && value !== 0) return "?";
  const units = ["B", "KB", "MB", "GB", "TB"]; let i = 0;
  while (value >= 1024 && i < units.length - 1) { value /= 1024; i++; }
  return `${value.toFixed(i ? 1 : 0)} ${units[i]}`;
}
function bar(fraction) {
  const span = el("span"); span.style.width = `${Math.max(0, Math.min(1, fraction)) * 100}%`;
  return el("div", {class: "bar"}, span);
}
function statusOf(experience, machine) {
  // A running experience on a machine that stopped talking is "silent", not "running".
  if (experience.status === "running" && machine.polled_age > 180) return "silent";
  return experience.status || "new";
}

async function call(path, options = {}) {
  const response = await fetch(path, {credentials: "same-origin", cache: "no-store", ...options});
  if (!response.ok) throw new Error(`${response.status} ${response.statusText}`);
  return response.json();
}
async function load() { state = await call("api/state"); render(); }
async function refresh() {
  if (busy) return; busy = true; $("refresh").disabled = true;
  $("status").textContent = "asking the machines…";
  try {
    state = await call("api/refresh", {method: "POST", headers: {"Content-Type": "application/json"}, body: "{}"});
    render();
  } catch (error) { $("status").textContent = `refresh failed: ${error.message}`; }
  busy = false; $("refresh").disabled = false;
}

function render() {
  const machines = state.machines || [];
  $("status").textContent = machines.length
    ? `${machines.length} machine(s) · page updated ${new Date().toLocaleTimeString()}`
    : "no machine connected yet";
  const cards = $("machines"); cards.replaceChildren();
  const rows = $("experiences"); rows.replaceChildren();
  let count = 0;
  for (const machine of machines) {
    const info = machine.snapshot.machine || {};
    const silent = machine.polled_age > 180;
    const card = el("div", {class: "panel machine"},
      el("h2", {}, info.alias || machine.alias,
        el("span", {class: `badge ${silent ? "s-silent" : "s-done"}`}, silent ? `silent ${ago(machine.polled_age)}` : "connected")),
      el("div", {class: "muted small"}, `snapshot ${ago(machine.age)}`, info.useml ? ` · useml ${info.useml}` : ""));
    if (machine.snapshot.setup) {
      card.append(el("button", {style: "margin-top:8px", onclick: () => { selected = `setup::${machine.alias}`; renderDetail(); }}, "useml setup"));
    }
    for (const gpu of info.gpus || []) {
      card.append(el("div", {class: "small"}, `GPU ${gpu.index} · ${gpu.name} · ${gpu.util}% · ${bytes(gpu.mem_used)} / ${bytes(gpu.mem_total)}`),
                  bar(gpu.mem_total ? gpu.mem_used / gpu.mem_total : 0));
    }
    if (info.ram) card.append(el("div", {class: "small"}, `RAM ${bytes(info.ram.total - info.ram.available)} / ${bytes(info.ram.total)}`),
                              bar((info.ram.total - info.ram.available) / info.ram.total));
    for (const disk of info.disks || []) {
      card.append(el("div", {class: "small"}, `disk ${disk.label}: ${bytes(disk.free)} free of ${bytes(disk.total)}`),
                  bar(1 - disk.free / disk.total));
    }
    cards.append(card);
    for (const experience of machine.snapshot.experiences || []) {
      count++;
      const status = statusOf(experience, machine);
      const progress = experience.progress;
      const fraction = experience.total ? experience.done / experience.total : 0;
      const key = `${machine.alias}::${experience.name}`;
      rows.append(el("tr", {class: "row", onclick: () => { selected = key; renderDetail(); }},
        el("td", {}, experience.name),
        el("td", {}, el("span", {class: `badge s-${status}`}, status)),
        el("td", {class: "hide-sm"}, experience.current_step || ""),
        el("td", {}, `${experience.done || 0}/${experience.total || 0}`,
           progress ? el("div", {class: "muted small"}, `${progress[0]}/${progress[1]} ${progress[2] || ""}`) : null,
           bar(fraction)),
        el("td", {class: "hide-sm"}, info.alias || machine.alias),
        el("td", {class: "hide-sm muted small"}, experience.updated ? ago(state.now - experience.updated) : "")));
    }
  }
  $("none").hidden = count > 0;
  renderDetail();
}

function chart(points, name) {
  const values = points.map((p) => p[name]).filter((v) => typeof v === "number");
  if (values.length < 2) return null;
  const xs = points.filter((p) => typeof p[name] === "number").map((p) => p.step);
  const minX = Math.min(...xs), maxX = Math.max(...xs), minY = Math.min(...values), maxY = Math.max(...values);
  const w = 600, h = 160, pad = 24;
  const path = xs.map((x, i) => {
    const px = pad + (maxX === minX ? 0 : (x - minX) / (maxX - minX)) * (w - 2 * pad);
    const py = h - pad - (maxY === minY ? 0.5 : (values[i] - minY) / (maxY - minY)) * (h - 2 * pad);
    return `${i ? "L" : "M"}${px.toFixed(1)},${py.toFixed(1)}`;
  }).join(" ");
  const svg = document.createElementNS("http://www.w3.org/2000/svg", "svg");
  svg.setAttribute("viewBox", `0 0 ${w} ${h}`); svg.setAttribute("class", "chart");
  svg.innerHTML = `<path d="${path}" fill="none" stroke="currentColor" stroke-width="2"/>`;
  svg.style.color = "var(--accent)";
  const label = (text, x, y, anchor) => {
    const t = document.createElementNS("http://www.w3.org/2000/svg", "text");
    t.setAttribute("x", x); t.setAttribute("y", y); t.setAttribute("font-size", "11");
    t.setAttribute("fill", "currentColor"); t.setAttribute("text-anchor", anchor); t.style.color = "var(--muted)";
    t.textContent = text; svg.append(t);
  };
  label(maxY.toPrecision(4), 4, 14, "start"); label(minY.toPrecision(4), 4, h - 6, "start");
  label(`step ${maxX}`, w - 4, h - 6, "end");
  return el("div", {}, el("div", {class: "small muted"}, name), svg);
}

function renderDetail() {
  const panel = $("detail");
  if (!selected || !state) { panel.hidden = true; return; }
  if (selected.startsWith("setup::")) { renderSetup(panel, selected.slice(7)); return; }
  const [alias, name] = selected.split("::");
  const machine = (state.machines || []).find((m) => m.alias === alias);
  const experience = machine && (machine.snapshot.experiences || []).find((e) => e.name === name);
  if (!experience) { panel.hidden = true; return; }
  panel.hidden = false; panel.replaceChildren();
  const status = statusOf(experience, machine);
  panel.append(el("h2", {style: "margin:0;font-size:16px"}, experience.name, " ",
                  el("span", {class: `badge s-${status}`}, status)),
               el("div", {class: "muted small"}, `${machine.snapshot.machine?.alias || alias} · snapshot ${ago(machine.age)}`));
  if (experience.error) {
    panel.append(el("h3", {}, "Why it stopped"), el("pre", {}, [experience.error.meaning, experience.error.message].filter(Boolean).join("\n\n")));
  }
  if (experience.steps) {
    const table = el("table", {class: "steps"}, el("thead", {}, el("tr", {}, el("th", {}, ""), el("th", {}, "Step"), el("th", {}, "Duration"), el("th", {class: "hide-sm"}, "Function"), el("th", {class: "hide-sm"}, "Output"))));
    const body = el("tbody");
    for (const step of experience.steps) {
      body.append(el("tr", {}, el("td", {}, step.done ? "✓" : step.name === experience.current_step ? "▶" : "·"),
        el("td", {}, step.name), el("td", {}, duration(step.seconds)),
        el("td", {class: "hide-sm muted small"}, step.function || ""), el("td", {class: "hide-sm muted small"}, step.output || "")));
    }
    table.append(body); panel.append(el("h3", {}, "Steps"), table);
  }
  for (const [step, points] of Object.entries(experience.metrics || {})) {
    const names = [...new Set(points.flatMap((p) => Object.keys(p)).filter((k) => k !== "step"))];
    const charts = names.map((n) => chart(points, n)).filter(Boolean);
    if (charts.length) panel.append(el("h3", {}, `Metrics · ${step}`), ...charts);
  }
  for (const [step, value] of Object.entries(experience.results || {})) {
    panel.append(el("h3", {}, `Result · ${step}`), el("pre", {}, JSON.stringify(value, null, 2)));
  }
  if ((experience.figures || []).length) {
    const grid = el("div", {class: "figures"});
    for (const figure of experience.figures) {
      const img = el("img", {alt: `${figure.step} ${figure.name}`, loading: "lazy"});
      img.src = `data:image/png;base64,${figure.png}`;
      grid.append(el("div", {}, img, el("div", {class: "small muted"}, `${figure.step} · ${figure.name}`)));
    }
    panel.append(el("h3", {}, "Figures"), grid);
  }
  for (const config of experience.configs || []) {
    panel.append(el("h3", {}, `Config · ${config.name} (cfg:${config.hash})`),
                 el("pre", {}, config.yaml || JSON.stringify(config.overrides || {}, null, 2)));
  }
  if (experience.datasets && experience.datasets.length) {
    panel.append(el("h3", {}, "Data"), el("div", {class: "small"}, experience.datasets.join(", ")));
  }
  if (experience.log && experience.log.length) {
    panel.append(el("h3", {}, "Log"), el("pre", {}, experience.log.join("\n")));
  }
}

function quote(text) { return "'" + String(text).split("'").join("'\\''") + "'"; }
function commandLine(text) {
  const code = el("code", {}, text);
  const button = el("button", {onclick: async () => {
    try { await navigator.clipboard.writeText(text); button.textContent = "copied"; }
    catch (error) { button.textContent = "select it"; }
    setTimeout(() => { button.textContent = "copy"; }, 1500);
  }}, "copy");
  return el("div", {class: "command"}, code, button);
}
function show(value) {
  if (value === null || value === undefined) return "—";
  return typeof value === "string" ? value : JSON.stringify(value);
}

function renderSetup(panel, alias) {
  const machine = (state.machines || []).find((m) => m.alias === alias);
  const setup = machine && machine.snapshot.setup;
  if (!setup) { panel.hidden = true; return; }
  panel.hidden = false; panel.replaceChildren();
  panel.append(el("h2", {style: "margin:0;font-size:16px"}, `useml on ${machine.snapshot.machine?.alias || alias}`),
               el("div", {class: "muted small"}, `useml ${setup.useml} · Python ${setup.python} · snapshot ${ago(machine.age)}`));
  for (const warning of setup.warnings || []) panel.append(el("p", {class: "warn small"}, `⚠ ${warning}`));
  if ((setup.suggestions || []).length) {
    panel.append(el("h3", {}, "Suggested commands"), ...setup.suggestions.map(commandLine));
  }
  const facts = el("div", {class: "kv small"});
  const fact = (key, value) => facts.append(el("div", {class: "muted"}, key), el("div", {}, value));
  const policy = setup.policy || {};
  fact("downloads", policy.parallel_allowed ? "parallel allowed" : `sequential (socket guard ${policy.socket_guard ? "on" : "off"}, xet ${policy.xet_disabled ? "off" : "on"})`);
  if (setup.downloads) fact("recorded downloads", `${setup.downloads.count} · ${bytes(setup.downloads.bytes)}`);
  if (setup.store && !setup.store.error) fact("cache store", `${bytes(setup.store.bytes)}${setup.store.budget ? ` of ${bytes(setup.store.budget)} budget` : " (no budget)"} · ${setup.store.spaces} spaces · ${bytes(setup.store.free)} free`);
  if (setup.processed && !setup.processed.error) fact("processed data", `${setup.processed.tables} tables · ${bytes(setup.processed.bytes)} · ${setup.processed.names} names${setup.processed.unused_tables ? ` · ${setup.processed.unused_tables} unused` : ""}`);
  if (Array.isArray(setup.datasets)) fact("datasets", setup.datasets.length ? setup.datasets.map((d) => `${d.name} (${d.state}${d.records ? `, ${d.records}` : ""})`).join(", ") : "none registered");
  fact("experiences", Object.entries(setup.experiences || {}).map(([k, v]) => `${v} ${k}`).join(", ") || "none");
  fact("tmux", setup.tmux ? "available" : "not installed");
  fact("caches left in the home", (setup.home_caches || []).map((c) => c.path).join(", ") || "none");
  fact("config file", setup.config_file);
  panel.append(el("h3", {}, "State"), facts);

  // Settings: the page only COMPOSES a command; it sends nothing to the machine.
  const settings = setup.settings || [];
  const table = el("table", {class: "settings"}, el("thead", {}, el("tr", {}, el("th", {}, "Setting"), el("th", {}, "Value"), el("th", {class: "hide-sm"}, "Meaning"))));
  const body = el("tbody");
  for (const entry of settings) {
    body.append(el("tr", {class: "row", onclick: () => { keyInput.value = entry.key.replace("<VARIABLE>", ""); valueInput.value = entry.value === null || entry.value === undefined ? "" : (typeof entry.value === "string" ? entry.value : JSON.stringify(entry.value)); compose(); }},
      el("td", {}, entry.key), el("td", {}, show(entry.value)), el("td", {class: "hide-sm muted small"}, `${entry.kind} · ${entry.meaning}`)));
  }
  table.append(body);
  const keyInput = el("input", {list: "setting-keys", placeholder: "monitor.log_lines"});
  const valueInput = el("input", {placeholder: 'value: 50, true, "text", ["a", "b"]'});
  const keys = el("datalist", {id: "setting-keys"}, ...settings.map((s) => el("option", {value: s.key})));
  const output = el("div");
  function compose() {
    output.replaceChildren();
    const key = keyInput.value.trim();
    if (!key) return;
    const value = valueInput.value.trim();
    output.append(value ? commandLine(`useml settings set ${key} ${quote(value)}`)
                        : commandLine(`useml settings unset ${key}`));
    output.append(el("div", {class: "muted small"}, "Run it on the machine. The dashboard never changes anything by itself; the previous file is kept as config.toml.bak."));
  }
  keyInput.addEventListener("input", compose); valueInput.addEventListener("input", compose);
  panel.append(el("h3", {}, "Settings"), el("div", {class: "muted small"}, "Click a row or type a key; empty value = remove it."),
               el("div", {class: "editor"}, el("label", {}, "key", keyInput), el("label", {}, "new value", valueInput), keys),
               output, table);
}

$("refresh").addEventListener("click", refresh);
$("auto").addEventListener("change", (event) => {
  clearInterval(timer);
  if (event.target.checked) timer = setInterval(refresh, 15000);
});
load().catch((error) => { $("status").textContent = `cannot load: ${error.message}`; });
</script>
</body>
</html>
